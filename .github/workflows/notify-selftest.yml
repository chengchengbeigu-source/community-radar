name: notify-selftest

# 一次性自检：验证 RADAR_QQ_* 三个 Secret 是否还能换到 access_token 并真把消息发出去。
# 用完即删（不留常驻文件）。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: QQ 通道自检
        env:
          RADAR_QQ_APPID: ${{ secrets.RADAR_QQ_APPID }}
          RADAR_QQ_SECRET: ${{ secrets.RADAR_QQ_SECRET }}
          RADAR_QQ_OPENID: ${{ secrets.RADAR_QQ_OPENID }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          appid = os.environ.get("RADAR_QQ_APPID") or ""
          secret = os.environ.get("RADAR_QQ_SECRET") or ""
          openid = os.environ.get("RADAR_QQ_OPENID") or ""
          print(f"Secret 到位情况：APPID={len(appid)}字符  SECRET={len(secret)}字符  OPENID={len(openid)}字符")
          print(f"APPID 形态：{appid[:9]}…{appid[-4:] if len(appid)>9 else ''}")
          print(f"OPENID 形态：{openid[:6]}…{openid[-4:] if len(openid)>6 else ''}")

          def post(url, payload, headers):
              req = urllib.request.Request(url, data=json.dumps(payload).encode(),
                                           headers={"Content-Type": "application/json", **headers},
                                           method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()
              except Exception as e:
                  return 0, f"{type(e).__name__}: {e}"

          st, body = post("https://bots.qq.com/app/getAppAccessToken",
                          {"appId": str(appid), "clientSecret": secret}, {})
          print(f"[1] getAppAccessToken → HTTP {st}")
          print(f"[1] 原始响应：{body[:400]}")
          try:
              tok = (json.loads(body) or {}).get("access_token") or ""
          except Exception:
              tok = ""
          if not tok:
              print("::error::取不到 access_token —— 通道断在这里，后面的发送没必要测")
              raise SystemExit(1)
          print(f"[1] access_token 长度={len(tok)}（内容已隐去）")

          st2, body2 = post(f"https://api.sgroup.qq.com/v2/users/{openid}/messages",
                            {"content": "[雷达自检] QQ 通道测试：收到这条说明推送是通的", "msg_type": 0},
                            {"Authorization": f"QQBot {tok}", "X-Union-Appid": str(appid)})
          print(f"[2] 发消息 → HTTP {st2}")
          print(f"[2] 原始响应：{body2[:400]}")
          print("::notice::自检结束")
          PY
