checkins:
- name: 小水管
  url: https://api.pie-xian.com/profile
  enabled: true
  jitter_minutes: 0
  kind: newapi
  proxy: direct
  access_token: ''
  user_id: ''
- name: nodeloc
  kind: discourse
  enabled: true
  base: https://www.nodeloc.com
  username: ''
  cookie_file: radar/secrets/nodeloc.cookie
  proxy: direct
  jitter_minutes: 30
  daily:
    checkin: true
    # read 交给心跳（radar/heartbeat.py 直接 POST /topics/timings）：服务端按真实
    # 墙上时钟 1:1 计入、单次 60 秒封顶，累计够 600 分钟必须真熬够时间。这里关掉只做
    # 例行同步 + 登录态体检，避免 run_daily 每轮再重复上报一次 dwell。
    read: false
    read_mode: api
    # 每日上限 240 分钟（4 小时）—— 一个真人再勤也就这样了。不要急着凑够 600 分钟：
    # 上限压低 + 心跳里随机离开（35~70 分钟活动后歇 3~12 分钟）+ 夜间 23→8 点完全不活动，
    # 宁可多花两天，也不要因为节奏太规整被当成机器。
    read_minutes: 240
    topics_per_run: 80
    dwell_s:
    - 45
    - 150
    gap_s:
    - 25
    - 90
    active_hours:
    - 8
    - 23
    quiet_hours:
    - 2
    - 7
  stop_at:
    trust_level: 1
    notify: true
