window_days: 14
notify: true
report_title: 社区情报雷达
outbox_keep_days: 60
notify_min_gap_minutes: 10
push_gap_seconds: 4

# ── 运行时间窗（2026-10-26 用户指定：早 8 点到晚 8 点，以手机本地时间为准）──
# 窗口外不采集、不推送，省电省流量，也免得半夜把人吵醒。
# 注意 collect_end_hour 是**含**该小时：20 表示 20:00~20:59 还在跑，21:00 起停。
collect_start_hour: 8
collect_end_hour: 20
min_stars: 3
min_score: 0
max_per_push: 10
push_translate: true
proxy: ''
schedule:
  collect_minutes: 60
  progress_minutes: 60
  checkin_hour: 8
  digest_hour: 20
  hb_slice_seconds: 600
  config_reload_minutes: 30
sources:
  nodeseek:
    enabled: true
    proxy: direct
    # CF 边缘反代（workers.dev 被 SNI 阻断，改用自有域名走 Workers Route）
    rss_via: "https://nds.582365.xyz/__proxy?url="
    rss_pages: 2
    listings:
    - /
    - /page-2
    - /page-3
    - /page-4
    - /page-5
    boards:
    - info
    - review
    - tech
    - dev
    - promotion
    - trade
    - carpool
    board_pages: 2
    retries: 2
  nodeloc:
    proxy: direct
    enabled: true
    base: https://www.nodeloc.com
    username: c47892969-ui
    cookie_file: radar/secrets/nodeloc.cookie
    latest_pages: 4
    search_terms:
    - 免费
    - 公益
    - 白嫖
    - 福利
    - 优惠
    - 教程
    - VPS
    search_pages: 1
  linuxdo:
    enabled: true
    proxy: direct
    # 走 RSS 而非 latest.json（后者被 Cloudflare 挑战挡成 403）
    endpoints:
      - "/latest.rss"
      - "/top.rss?period=daily"
    # 只留干货板块；闲聊「搞七捻三」默认也留（有羊毛帖混在里面）
    keep_boards: ["开发调优", "资源分享", "福利", "技术", "教程", "分享", "搞七捻三"]
    keep_all: false
  linuxsb:
    enabled: true
    proxy: direct
    # 烧饼社区：2=福利放送 4=技术交流（羊毛+干货两块）
    forums: [2, 4]
    rss_period: "24h"
    # 列表页只有标题，正文要进单帖页抓。每轮最多补这么多条（防拖慢采集）
    body_fetch_max: 12
  # 通用 RSS 源：面板里加一行就能接一个新站，不用写代码
  feed:
    enabled: true
    proxy: direct
    feeds: []
  x:
    enabled: true
    proxy: direct
    # 每账号只能看到最近 5~9 条（X 免鉴权页面上限），靠 uid 去重做增量
    accounts:
    - opencode
    - deepseek_ai
    - Cloudflare
    - kimi_moonshot
    - Alibaba_Qwen
    - MiniMax_AI
    - AI21Labs
    - perplexity_ai
    - MistralAI
    - xai
    - OpenAI
    - AnthropicAI
    - huggingface
    - vllm_project
    - ollama
    per_account: 8
    delay: 0.8
    # 钉死的单推：用户点名要跟的，永远不丢
    tweets:
    - https://x.com/opencode/status/2113699251616412056
