# 本文件由「配置面板」插件 UI 写入（本机 2026-10-12 19:18:15）
# 公开仓库版本：不含任何密钥，密钥一律走 GitHub Secrets，由 radar/github_secrets.py 灌入
window_days: 14
notify: true
report_title: 内容摘要
outbox_keep_days: 60
# 推送节流：距上次「采集简报」推送不足这么多分钟就跳过。0 = 不节流。
# 采集本身现在是每 collect_minutes 分钟一轮（见下面 schedule），有新条目就推，
# 所以这里只当防抖用，压得很低。例行同步/进度/日报不受它管，各有各的间隔。
# 见 radar/collect.py 的 notify_gap_ok()。
notify_min_gap_minutes: 10
# 过滤门槛（radar/report.py 的 filter_rows()）：低于这个标准的帖子不进简报、不推送通知。
# 之前只排序不剔除，低质内容/水贴照样推 —— 现在真砍掉。
min_stars: 3          # 星级 < 3 的一律不推（3★ 起才算「备着」）
min_score: 0          # 裸评分低于这个数的也砍
proxy: ''
# ── 常驻任务表（radar/scheduler.py 读；GitHub cron 只管把一轮拉起来）──
# 「几点做什么」看这里，不看 cron：GitHub 的 schedule 实测延迟过 8 小时 48 分，
# 把「每晚 20:00 汇报」押在 cron 上等于赌博。
schedule:
  collect_minutes: 20          # 每这么久采集一次；有新条目立刻推送通知
  progress_minutes: 60         # 每这么久推一条在线时长进度
  checkin_hour: 8              # 每天这个整点后第一次循环做例行同步，并推结果（漏了会补）
  digest_hour: 20              # 每天这个整点推当日总结 = 晚上 8 点
  hb_slice_seconds: 600        # 心跳切片：每跑这么久回来看一次任务表
  config_reload_minutes: 30    # 每这么久从 origin/main 拉一次 config.yaml
                               # → 手机上改完配置，最快 30 分钟就在云端生效
