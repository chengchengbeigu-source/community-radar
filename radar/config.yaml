checkins:
- name: 小水管
  url: https://api.pie-xian.com/profile
  enabled: true
  jitter_minutes: 0
  kind: newapi
  proxy: direct
  access_token: ''
  user_id: ''
- name: nodeloc
  kind: discourse
  enabled: true
  base: https://www.nodeloc.com
  username: ''
  cookie_file: radar/secrets/nodeloc.cookie
  proxy: direct
  jitter_minutes: 30
  daily:
    checkin: true
    # read 交给心跳（radar/heartbeat.py 直接 POST /topics/timings）：服务端按真实
    # 墙上时钟 1:1 计入、单次 60 秒封顶，累计够 600 分钟必须真熬够时间。这里关掉只做
    # 例行同步 + 登录态体检，避免 run_daily 每轮再重复上报一次 dwell。
    read: false
    read_mode: api
    # 每日上限 240 分钟（4 小时）—— 一个真人再勤也就这样了。不要急着凑够 600 分钟：
    # 上限压低 + 心跳里随机离开（35~70 分钟活动后歇 3~12 分钟），
    # 宁可多花两天，也不要因为节奏太规整被当成机器。
    read_minutes: 240
    # 收尾自适应（2026-10-14 加）：站内累计进度距目标只剩这么多分钟以内时，
    # 临时忽略上面的日上限，一口气把差的那点补完。不加这一条会出问题：
    # 240/天 的日额度撞上 600 分钟的累计目标，额度一满就冻结一整天，
    # 用户看到的「在线进度」就是同一个数字来回推 —— 像「阅读时长不再更新」。
    # 2026-10-15 收尾期间曾临时给到 240（站内 536/600 时差额 64 分钟 > 60，**差 4 分钟
    # 没触发**收尾，额度一满就整天整天空转）。600 分钟已于 2026-10-15 补满、TL1 白银已
    # 解锁并停机，窗口不再需要，恢复常规值 60。
    finish_gap_minutes: 60
    topics_per_run: 80
    dwell_s:
    - 45
    - 150
    gap_s:
    - 25
    - 90
    # 2026-10-15 收尾期间曾临时改成 active_hours 0-24 + quiet_hours []（不静默），
    # 目的是把累计阅读时长尽快补到 600 → 解锁白银（TL1）。该目标已于 2026-10-15 达成
    # （608/600，L1），stop_at 已自动停机，24 小时窗口随之关闭，恢复常规作息。
    # 注意 heartbeat.py 取 quiet_hours 时必须区分「没配」和「配成空」：[] 是假值，
    # 写成 `or DEFAULT_QUIET` 会把「关掉夜间静默」悄悄换回默认的 2:00-7:00。
    active_hours:
    - 8
    - 23
    quiet_hours:
    - 2
    - 7
  stop_at:
    trust_level: 1
    notify: true
    # 2026-10-15 加：达标后**只停阅读保活，不停每日签到**。
    # 签到是白银档每天 5 能量（青铜 1），零成本、不刷时长、不碰保活那套风控节奏；
    # 跟着一起停等于每天白丢 5 个。注意光改配置不够 —— discourse.run_daily 原来在
    # 「看等级」那一步就 return，签到代码永远走不到，配套改了那里（同一提交）。
    # 想恢复老行为（连签到一起停）：改成 false。
    keep_checkin: true
